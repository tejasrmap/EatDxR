<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141417" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f97316" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Dark Obsidian Base with smooth squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="#27272a" stroke-width="8" />

  <!-- Inner Subtle Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Stylized Iconic "M" for Madeater with fork crown -->
  <g filter="url(#glow)">
    <!-- Left Column of M -->
    <path d="M128 384 L128 176 C128 160 144 148 160 156 L240 204 C250 210 262 210 272 204 L352 156 C368 148 384 160 384 176 L384 384 C384 396 372 408 360 408 L348 408 C336 408 324 396 324 384 L324 232 L276 264 C264 272 248 272 236 264 L188 232 L188 384 C188 396 176 408 164 408 L152 408 C140 408 128 396 128 384 Z" fill="url(#flame-grad)" />
    
    <!-- Central Culinary Flame Dot / Star Sparkle -->
    <circle cx="256" cy="132" r="28" fill="url(#accent-grad)" />
    <path d="M256 92 L260 120 L288 124 L260 128 L256 156 L252 128 L224 124 L252 120 Z" fill="#ffffff" />
  </g>
</svg>
